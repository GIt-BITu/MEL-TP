name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
            artifact: jeu-mines-linux
            image: dist/JeuMines
            launcher: dist/JeuMines/bin/JeuMines
          - os: windows-latest
            name: Windows
            artifact: jeu-mines-windows
            image: dist/JeuMines
            launcher: dist/JeuMines/JeuMines.exe
          - os: macos-latest
            name: macOS
            artifact: jeu-mines-macos
            image: dist/JeuMines.app
            launcher: dist/JeuMines.app/Contents/MacOS/JeuMines

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Build native app image
        shell: bash
        run: |
          mkdir package-input
          cp target/jeu-mines-1.0.0.jar package-input/
          jpackage \
            --type app-image \
            --name JeuMines \
            --app-version 1.0.0 \
            --vendor "Jeu Mines" \
            --input package-input \
            --main-jar jeu-mines-1.0.0.jar \
            --dest dist

      - name: Verify native launcher
        shell: bash
        run: test -f "${{ matrix.launcher }}"

      - name: Upload native app image
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.image }}
          if-no-files-found: error
